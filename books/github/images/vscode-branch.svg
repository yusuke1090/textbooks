<text x="74.0" y="89.5" font-size="11.5" text-anchor="start" fill="#8b93a1">Select a branch or tag to checkout</text>
<rect x="60.0" y="102.0" width="420.0" height="23.0" rx="0" fill="#2a4a72"/>
<text x="78.0" y="118.0" font-size="12" text-anchor="start" fill="#e3e7ee">+ Create new branch...</text>
<text x="78.0" y="142.0" font-size="12" text-anchor="start" fill="#e3e7ee">+ Create new branch from...</text>
<text x="78.0" y="166.0" font-size="12" text-anchor="start" fill="#e3e7ee">Checkout detached...</text>
<text x="78.0" y="208.0" font-size="12" text-anchor="start" fill="#e3e7ee">main</text>
<text x="117.8" y="208.0" font-size="11" text-anchor="start" fill="#8b93a1">3d3b5db・I2C の読み取りを足した</text>
<text x="78.0" y="232.0" font-size="12" text-anchor="start" fill="#e3e7ee">try-sleep</text>
<text x="152.6" y="232.0" font-size="11" text-anchor="start" fill="#8b93a1">9f8e7d6・スリープを試す</text>
<text x="78.0" y="274.0" font-size="12" text-anchor="start" fill="#e3e7ee">origin/main</text>
<text x="166.6" y="274.0" font-size="11" text-anchor="start" fill="#8b93a1">a1c2e3f・LED のピンを変えた</text>
<line x1="60.0" y1="180.0" x2="480.0" y2="180.0" stroke="#3a404a" stroke-width="1"/>
<text x="474.0" y="192.0" font-size="10.5" text-anchor="end" fill="#8b93a1">branches</text>
<line x1="60.0" y1="246.0" x2="480.0" y2="246.0" stroke="#3a404a" stroke-width="1"/>
<text x="474.0" y="258.0" font-size="10.5" text-anchor="end" fill="#8b93a1">remote branches</text>
<rect x="22.0" y="367.0" width="496.0" height="26.0" rx="0" fill="#2f6fde"/>
<circle cx="32.0" cy="374.0" r="2" fill="none" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="32.0" cy="386.0" r="2" fill="none" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="41.0" cy="377.0" r="2" fill="none" stroke="#ffffff" stroke-width="1.4"/>
<line x1="32.0" y1="376.0" x2="32.0" y2="384.0" stroke="#ffffff" stroke-width="1.4"/>
<path d="M41 379 Q41 383 33 384" fill="none" stroke="#ffffff" stroke-width="1.4"/>
<text x="48.0" y="384.5" font-size="12" text-anchor="start" fill="#ffffff">main*</text>
<text x="96.8" y="384.5" font-size="12" text-anchor="start" fill="#ffffff">↻ 0↓ 1↑</text>
<circle cx="178.0" cy="380.0" r="11" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="178.0" y="384.0" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
<circle cx="470.0" cy="114.0" r="11" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="470.0" y="118.0" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
<circle cx="470.0" cy="220.0" r="11" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="470.0" y="224.0" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
<circle cx="470.0" cy="286.0" r="11" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="470.0" y="290.0" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
<circle cx="550.0" cy="88.0" r="11" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="550.0" y="92.0" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
<text x="570.0" y="92.0" font-size="12" text-anchor="start" fill="#2b2f36">左下のブランチ名を押すと、</text>
<text x="570.0" y="108.0" font-size="12" text-anchor="start" fill="#2b2f36">上に一覧が出る</text>
<circle cx="550.0" cy="138.0" r="11" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="550.0" y="142.0" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
<text x="570.0" y="142.0" font-size="12" text-anchor="start" fill="#2b2f36">新しいブランチを作って移る</text>
<text x="570.0" y="158.0" font-size="12" text-anchor="start" fill="#2b2f36">（git switch -c）。名前を打って Enter</text>
<circle cx="550.0" cy="188.0" r="11" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="550.0" y="192.0" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
<text x="570.0" y="192.0" font-size="12" text-anchor="start" fill="#2b2f36">手元のブランチ。押すと、そこに移る</text>
<text x="570.0" y="208.0" font-size="12" text-anchor="start" fill="#2b2f36">（git switch）</text>
<circle cx="550.0" cy="238.0" r="11" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="550.0" y="242.0" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
<text x="570.0" y="242.0" font-size="12" text-anchor="start" fill="#2b2f36">GitHub にあるブランチ。押すと、</text>
<text x="570.0" y="258.0" font-size="12" text-anchor="start" fill="#2b2f36">手元にも同じ名前で作って移る</text>
<text x="410.0" y="418.0" font-size="11" text-anchor="middle" fill="#555c66">表示や並びは、VS Code のバージョンで少し違うことがある</text>
</svg>
