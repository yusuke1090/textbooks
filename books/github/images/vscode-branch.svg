<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<rect x="0.0" y="0.0" width="820.0" height="430.0" rx="10" fill="#ffffff"/>
<text x="410.0" y="28.0" font-size="16" text-anchor="middle" fill="#2b2f36" font-weight="700">ブランチの切り替えと作成（イメージ）</text>
