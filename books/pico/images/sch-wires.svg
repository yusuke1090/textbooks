<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<rect width="760" height="300" rx="10" fill="#ffffff"/>
<text x="380.0" y="26.0" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">線がつながっている所と、つながっていない所</text>
<rect x="20" y="46" width="228" height="210" rx="8" fill="#f7f8fa" stroke="#d5d9e0" stroke-width="1.5"/>
<text x="34.0" y="68.0" font-size="13" text-anchor="start" font-weight="700" fill="#555c66"></text>
<path d="M64.0 130.0 L204.0 130.0" fill="none" stroke="#2f6fde" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M134.0 70.0 L134.0 190.0" fill="none" stroke="#2f6fde" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="134.0" cy="130.0" r="3.8" fill="#2f6fde"/>
<text x="134.0" y="222.0" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">点がある</text>
<text x="134.0" y="242.0" font-size="13" text-anchor="middle" font-weight="700" fill="#2f6fde">→ つながっている</text>
<rect x="266" y="46" width="228" height="210" rx="8" fill="#f7f8fa" stroke="#d5d9e0" stroke-width="1.5"/>
<text x="280.0" y="68.0" font-size="13" text-anchor="start" font-weight="700" fill="#555c66"></text>
<path d="M310.0 130.0 L450.0 130.0" fill="none" stroke="#2f6fde" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M380.0 70.0 L380.0 190.0" fill="none" stroke="#d93a3a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="380.0" y="222.0" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">点がない</text>
<text x="380.0" y="242.0" font-size="13" text-anchor="middle" font-weight="700" fill="#d93a3a">→ つながっていない</text>
<rect x="512" y="46" width="228" height="210" rx="8" fill="#f7f8fa" stroke="#d5d9e0" stroke-width="1.5"/>
<text x="526.0" y="68.0" font-size="13" text-anchor="start" font-weight="700" fill="#555c66"></text>
<path d="M556.0 130.0 L696.0 130.0" fill="none" stroke="#2f6fde" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M626.0 130.0 L626.0 190.0" fill="none" stroke="#2f6fde" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="626.0" cy="130.0" r="3.8" fill="#2f6fde"/>
<text x="626.0" y="222.0" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">T の字</text>
<text x="626.0" y="242.0" font-size="13" text-anchor="middle" font-weight="700" fill="#2f6fde">→ つながっている</text>
<text x="380.0" y="282.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">色は説明のため。同じ色の線は、つながっていて同じ電圧（本物の回路図はふつう全部黒）</text>
</svg>
