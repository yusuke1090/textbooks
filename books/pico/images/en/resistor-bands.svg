<text x="200.0" y="160.0" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">3</text>
<rect x="241" y="78" width="18" height="44" fill="#f08c00" stroke="#7d7462" stroke-width="0.8"/>
<text x="250.0" y="142.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">Orange</text>
