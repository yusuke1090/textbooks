<text x="300.0" y="160.0" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">+1 zero</text>
<rect x="461" y="78" width="18" height="44" fill="#c9a227" stroke="#7d7462" stroke-width="0.8"/>
<text x="470.0" y="142.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">Gold</text>
<text x="470.0" y="160.0" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">tolerance</text>
<text x="590.0" y="107.0" font-size="20" text-anchor="start" font-weight="700" fill="#2b2f36">→ 330Ω</text>
