<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs><marker id="ah-8a919c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a919c"/></marker></defs>
<rect width="760" height="230" rx="10" fill="#ffffff"/>
<text x="380" y="28" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">Example: the flow of IoT for monitoring cow behavior</text>
<rect x="20" y="50" width="165" height="96" rx="8" fill="#eef4ff" stroke="#2f6fde" stroke-width="2"/>
<text x="102.5" y="85.1" font-size="15" text-anchor="middle" font-weight="700" fill="#2b2f36">① Measure</text>
<text x="102.5" y="106.5" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">Collar sensors</text>
<text x="102.5" y="123.9" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">Accel, pressure (Ch. 9–10)</text>
<line x1="187" y1="98" x2="201" y2="98" stroke="#8a919c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-8a919c)"/>
<rect x="205" y="50" width="165" height="96" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="287.5" y="85.1" font-size="15" text-anchor="middle" font-weight="700" fill="#2b2f36">② Record, classify</text>
<text x="287.5" y="106.5" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">The Pico makes features</text>
<text x="287.5" y="123.9" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">and classifies (Ch. 15)</text>
<line x1="372" y1="98" x2="386" y2="98" stroke="#8a919c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-8a919c)"/>
<rect x="390" y="50" width="165" height="96" rx="8" fill="#fff6e0" stroke="#e0a800" stroke-width="2"/>
<text x="472.5" y="85.1" font-size="15" text-anchor="middle" font-weight="700" fill="#2b2f36">③ Send</text>
<text x="472.5" y="106.5" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">WiFi, LoRa, etc.</text>
<text x="472.5" y="123.9" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">(Pico W etc.)</text>
<line x1="557" y1="98" x2="571" y2="98" stroke="#8a919c" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-8a919c)"/>
<rect x="575" y="50" width="165" height="96" rx="8" fill="#f3ecfa" stroke="#6b3fa0" stroke-width="2"/>
<text x="657.5" y="85.1" font-size="15" text-anchor="middle" font-weight="700" fill="#2b2f36">④ Collect and view</text>
<text x="657.5" y="106.5" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">In the cloud or on a PC</text>
<text x="657.5" y="123.9" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">make graphs and alerts</text>
<text x="20" y="180" font-size="12.5" text-anchor="start" font-weight="400" fill="#555c66">Classifying on the Pico sends one behavior name every few seconds, not hundreds of numbers a second,</text>
<text x="20" y="199" font-size="12.5" text-anchor="start" font-weight="400" fill="#555c66">saving a lot of data and battery.</text>
</svg>
