<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs><marker id="ah-1f7a3d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f7a3d"/></marker><marker id="ah-c28a00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c28a00"/></marker><marker id="ah-6b3fa0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b3fa0"/></marker><marker id="ah-c0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ah-555c66" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555c66"/></marker><marker id="ah-2f6fde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fde"/></marker></defs>
<rect width="820" height="400" rx="10" fill="#ffffff"/>
<text x="410.0" y="28" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">How things work when developing C++ in VS Code</text>
<rect x="20" y="60" width="230" height="150" rx="8" fill="#e8f0fd" stroke="#2f6fde" stroke-width="2"/>
<text x="135.0" y="82" font-size="14" text-anchor="middle" font-weight="700" fill="#2f6fde">VS Code</text>
<text x="135.0" y="104" font-size="12" text-anchor="middle" fill="#555c66">Write code, completion, errors</text>
<text x="135.0" y="122" font-size="12" text-anchor="middle" fill="#555c66"></text>
<text x="135.0" y="140" font-size="12" text-anchor="middle" fill="#555c66">"Raspberry Pi Pico" extension</text>
<text x="135.0" y="158" font-size="12" text-anchor="middle" fill="#555c66">Build, flash, debug with buttons</text>
<rect x="20" y="240" width="230" height="140" rx="8" fill="#fff6e0" stroke="#c28a00" stroke-width="2"/>
<text x="32" y="262" font-size="14" text-anchor="start" font-weight="700" fill="#c28a00">Project ~/apps/collar</text>
<text x="32" y="284" font-size="12" text-anchor="start" fill="#555c66">CMakeLists.txt (build settings)</text>
<text x="32" y="302" font-size="12" text-anchor="start" fill="#555c66">collar.cpp (your program)</text>
<text x="32" y="320" font-size="12" text-anchor="start" fill="#555c66">.vscode/ (extension settings)</text>
<text x="32" y="338" font-size="12" text-anchor="start" fill="#555c66">build/collar.uf2 (the output)</text>
<rect x="300" y="60" width="230" height="170" rx="8" fill="#f1ebf8" stroke="#6b3fa0" stroke-width="2"/>
<text x="312" y="82" font-size="14" text-anchor="start" font-weight="700" fill="#6b3fa0">~/.pico-sdk (auto-installed)</text>
<text x="312" y="104" font-size="12" text-anchor="start" fill="#555c66">Pico SDK</text>
<text x="312" y="122" font-size="12" text-anchor="start" fill="#555c66">ARM compiler</text>
<text x="312" y="140" font-size="12" text-anchor="start" fill="#555c66">CMake, Ninja (build tools)</text>
<text x="312" y="158" font-size="12" text-anchor="start" fill="#555c66">picotool (flashes over USB)</text>
<text x="312" y="176" font-size="12" text-anchor="start" fill="#555c66">OpenOCD (for debugging)</text>
<rect x="620" y="60" width="180" height="110" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="710.0" y="82" font-size="14" text-anchor="middle" font-weight="700" fill="#1f7a3d">Pico</text>
<text x="710.0" y="104" font-size="12" text-anchor="middle" fill="#555c66">Flash over USB</text>
<text x="710.0" y="122" font-size="12" text-anchor="middle" fill="#555c66">printf output</text>
<rect x="620" y="240" width="180" height="110" rx="8" fill="#f3f4f6" stroke="#555c66" stroke-width="2"/>
<text x="710.0" y="262" font-size="14" text-anchor="middle" font-weight="700" fill="#555c66">Debug Probe (optional)</text>
<text x="710.0" y="284" font-size="12" text-anchor="middle" fill="#555c66">Connects to the Pico</text>
<text x="710.0" y="302" font-size="12" text-anchor="middle" fill="#555c66">with 3 SWD wires</text>
<text x="710.0" y="320" font-size="12" text-anchor="middle" fill="#555c66">Stop at a line to inspect</text>
<path d="M250 135 L298 135" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="274" y="128" font-size="11" text-anchor="middle" fill="#2f6fde">uses</text>
<path d="M135 210 L135 238" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="190" y="228" font-size="11" text-anchor="middle" fill="#2f6fde">create, build</text>
<path d="M530 125 L618 125" fill="none" stroke="#1f7a3d" stroke-width="2" marker-end="url(#ah-1f7a3d)"/>
<text x="574" y="105" font-size="11" text-anchor="middle" fill="#1f7a3d">Run Project</text>
<text x="574" y="119" font-size="11" text-anchor="middle" fill="#1f7a3d">(USB)</text>
<path d="M530 200 L618 290" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-6b3fa0)"/>
<text x="552" y="252" font-size="11" text-anchor="end" fill="#6b3fa0">Debug /</text>
<text x="566" y="268" font-size="11" text-anchor="end" fill="#6b3fa0">Flash (SWD)</text>
<path d="M710 240 L710 172" fill="none" stroke="#555c66" stroke-width="2" marker-end="url(#ah-555c66)"/>
<text x="732" y="210" font-size="11" text-anchor="middle" fill="#555c66">SWD</text>
<text x="415" y="300" font-size="11" text-anchor="middle" fill="#555c66">Nothing is installed system-wide, so it does not clash with</text>
<text x="415" y="316" font-size="11" text-anchor="middle" fill="#555c66">other software or the command-line tools (Appendix A)</text>
</svg>
