<text x="221.0" y="260.0" font-size="12" text-anchor="start" fill="#1f1f1d" font-weight="700">θ = 45°</text>
<text x="296.0" y="278.0" font-size="13" text-anchor="start" fill="#2a78d6" font-weight="700">a = (2, 1)</text>
<text x="236.0" y="134.0" font-size="13" text-anchor="start" fill="#eb6834" font-weight="700">b = (1, 3)</text>
<text x="560.0" y="100.0" font-size="13" text-anchor="start" fill="#1f1f1d" font-weight="700">b の a への正射影</text>
<text x="560.0" y="124.0" font-size="12.5" text-anchor="start" fill="#52514e">= (a·b / |a|²) a = (5/5) a = (2, 1)</text>
<text x="560.0" y="160.0" font-size="12.5" text-anchor="start" fill="#52514e">赤い点線 b − (2, 1) = (−1, 2) は</text>
<text x="560.0" y="182.0" font-size="12.5" text-anchor="start" fill="#52514e">a と直交する（内積が 0）</text>
<text x="560.0" y="218.0" font-size="12.5" text-anchor="start" fill="#52514e">cos θ = a·b / (|a||b|) = 5 / (√5 √10) = 1/√2</text>
