<text x="340.0" y="230.0" font-size="12" text-anchor="start" fill="#2a78d6" font-weight="700">x₁ = (1, 1)</text>
<text x="464.0" y="74.0" font-size="12" text-anchor="end" fill="#2a78d6" font-weight="700">Ax₁ = 5x₁</text>
<text x="340.0" y="312.0" font-size="12" text-anchor="start" fill="#eb6834" font-weight="700">x₂ = (1, −2)</text>
<text x="374.0" y="380.0" font-size="12" text-anchor="start" fill="#eb6834" font-weight="700">Ax₂ = 2x₂</text>
<text x="292.0" y="220.0" font-size="11.5" text-anchor="end" fill="#8a8984" font-weight="700">(0, 1)</text>
<text x="326.0" y="142.0" font-size="11.5" text-anchor="end" fill="#8a8984" font-weight="700">A(0, 1) = (1, 3)</text>
<text x="560.0" y="70.0" font-size="13" text-anchor="start" fill="#1f1f1d" font-weight="700">A = (4 1; 2 3)</text>
<text x="560.0" y="100.0" font-size="12.5" text-anchor="start" fill="#52514e">An eigenvector keeps its direction;</text>
<text x="560.0" y="122.0" font-size="12.5" text-anchor="start" fill="#52514e">only its length scales by the eigenvalue</text>
<text x="560.0" y="160.0" font-size="12.5" text-anchor="start" fill="#1f1f1d" font-weight="700">(1, 1) becomes 5 times, (1, −2) 2 times</text>
<text x="560.0" y="198.0" font-size="12.5" text-anchor="start" fill="#52514e">An ordinary vector (gray) like (0, 1)</text>
<text x="560.0" y="220.0" font-size="12.5" text-anchor="start" fill="#52514e">becomes (1, 3): its direction changes too</text>
