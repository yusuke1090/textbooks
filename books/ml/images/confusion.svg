<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="system-ui, 'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="12">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker></defs>
<rect width="820" height="320" rx="10" fill="#ffffff"/>
<text x="410.0" y="30.0" font-size="14" text-anchor="middle" fill="#1f1f1d" font-weight="700">混同行列（2クラス）/ confusion matrix</text>
<text x="440.0" y="60.0" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="700">予測 / predicted</text>
<text x="345.0" y="80.0" font-size="12.5" text-anchor="middle" fill="#1f1f1d" font-weight="700">0（陰性）</text><text x="535.0" y="80.0" font-size="12.5" text-anchor="middle" fill="#1f1f1d" font-weight="700">1（陽性）</text>
<text x="130.0" y="180.0" font-size="12.5" text-anchor="middle" fill="#52514e" font-weight="700" transform="rotate(-90 130 180)">実際 / actual</text>
<text x="238.0" y="140.0" font-size="12.5" text-anchor="end" fill="#1f1f1d" font-weight="700">0（陰性）</text><text x="238.0" y="230.0" font-size="12.5" text-anchor="end" fill="#1f1f1d" font-weight="700">1（陽性）</text>
<rect x="252" y="92" width="186" height="86" rx="8" fill="#1baf7a" opacity="0.16"/>
<rect x="252" y="92" width="186" height="86" rx="8" fill="none" stroke="#1baf7a" stroke-width="2"/>
<text x="345.0" y="126.0" font-size="15" text-anchor="middle" fill="#1f1f1d" font-weight="700">TN（真陰性）</text>
<text x="345.0" y="150.0" font-size="12" text-anchor="middle" fill="#52514e">正しく 0</text>
<rect x="442" y="92" width="186" height="86" rx="8" fill="#eb6834" opacity="0.16"/>
<rect x="442" y="92" width="186" height="86" rx="8" fill="none" stroke="#eb6834" stroke-width="2"/>
<text x="535.0" y="126.0" font-size="15" text-anchor="middle" fill="#1f1f1d" font-weight="700">FP（偽陽性）</text>
<text x="535.0" y="150.0" font-size="12" text-anchor="middle" fill="#52514e">0 を 1 と誤る</text>
<rect x="252" y="182" width="186" height="86" rx="8" fill="#eb6834" opacity="0.16"/>
<rect x="252" y="182" width="186" height="86" rx="8" fill="none" stroke="#eb6834" stroke-width="2"/>
<text x="345.0" y="216.0" font-size="15" text-anchor="middle" fill="#1f1f1d" font-weight="700">FN（偽陰性）</text>
<text x="345.0" y="240.0" font-size="12" text-anchor="middle" fill="#52514e">1 を 0 と見逃す</text>
<rect x="442" y="182" width="186" height="86" rx="8" fill="#1baf7a" opacity="0.16"/>
<rect x="442" y="182" width="186" height="86" rx="8" fill="none" stroke="#1baf7a" stroke-width="2"/>
<text x="535.0" y="216.0" font-size="15" text-anchor="middle" fill="#1f1f1d" font-weight="700">TP（真陽性）</text>
<text x="535.0" y="240.0" font-size="12" text-anchor="middle" fill="#52514e">正しく 1</text>
<text x="410.0" y="300.0" font-size="12.5" text-anchor="middle" fill="#1f1f1d" font-weight="700">正解率 = (TP + TN) / 全体　適合率 = TP / (TP + FP)　再現率 = TP / (TP + FN)</text>
</svg>
