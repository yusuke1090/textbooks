<!doctype html>
<html lang="ja" data-no-tr-chip>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教科書</title>
<meta name="description" content="いろいろなことを勉強するための教科書。牛の教科書、ラズパイピコ開発ガイドなど。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root {
  --bg: #f5f7f2; --panel: #ffffff; --border: #dde3d6; --text: #1e2a1c; --muted: #66735f;
  --accent: #2e7d32; --accent-soft: #cfe6cc; --link: #1b5e20; --th: #eef3ea; --quote: #fff8e1; --quote-border: #f0c75e;
  --code-bg: #fbfbfa; --ok: #1f7a3d; --warn: #c27c0e; --err: #d64545;
  --hl-yellow: rgba(255, 214, 0, .55); --hl-pink: rgba(255, 105, 180, .38); --hl-green: rgba(60, 200, 100, .36);
  --hl-blue: rgba(80, 150, 255, .34); --study-bg: #e4f0df; --st-yellow: #f7d84a; --st-pink: #f6a5c8; --st-green: #8fd4a4; --st-blue: #9cc0fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121611; --panel: #1a2019; --border: #2d372a; --text: #e4ebdf; --muted: #93a08c;
    --accent: #66bb6a; --accent-soft: #2f4a2f; --link: #a5d6a7; --th: #222b20; --quote: #2a2618; --quote-border: #8a7330;
    --code-bg: #151a14; --ok: #66bb6a; --warn: #e3a33b; --err: #f06a6a;
    --hl-yellow: rgba(255, 214, 0, .38); --hl-pink: rgba(255, 92, 170, .45); --hl-green: rgba(70, 210, 110, .38); --hl-blue: rgba(90, 150, 255, .48); --study-bg: #1b2a1b;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 64px; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15.5px/1.85 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
a { color: var(--link); }
button { font: inherit; }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
[hidden] { display: none !important; }

/* ---------- 本棚 ---------- */
.shelf-head { background: var(--panel); border-bottom: 1px solid var(--border); }
.shelf-head .wrap { padding-top: 26px; padding-bottom: 20px; }
.shelf-head h1 { margin: 0 0 4px; font-size: 24px; }
.shelf-head p { margin: 0; color: var(--muted); font-size: 14px; }
.shelf-main { padding-bottom: 40px; }
.grp { margin: 24px 0 10px; font-size: 15px; color: var(--muted); }
.books { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border: 1px solid var(--border); border-radius: 14px;
  background: var(--panel); color: var(--text); text-decoration: none; }
.card:hover { border-color: var(--accent); }
.card .ic { font-size: 34px; line-height: 1.2; }
.card h3 { margin: 0; font-size: 18px; line-height: 1.5; }
.card p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.7; color: var(--muted); }
.card .meta { margin-top: auto; padding-top: 8px; font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.card .meta b { color: var(--link); font-weight: 600; }
/* 今勉強中（カードをドラッグで出し入れ） */
.books .card { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.zone { margin: 20px -12px 0; padding: 0 10px 12px; border: 2px dashed transparent; border-radius: 18px; background: var(--study-bg); }
.zone .grp { margin-top: 12px; color: var(--accent); }
.zone .books { min-height: 72px; }
.zone.empty, body.drag .zone { border-color: var(--accent-soft); }
body.drag .zone.over { border-color: var(--accent); background: var(--accent-soft); }
.card .prog { display: none; }
.zone .card .prog { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
/* 練習問題の結果（● 正解・× まちがい・○ まだ。章ごとに少しあける） */
.card .qzdots { display: none; }
.zone .card .qzdots:not(:empty) { display: flex; flex-wrap: wrap; gap: 5px 9px; }
.qzdots > span { display: flex; gap: 3px; }
.qz-clear { margin-left: auto; padding: 0 9px; font: inherit; font-size: 11.5px; line-height: 18px; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 9px; cursor: pointer; }
.qz-clear:hover { color: var(--err); border-color: var(--err); }
.qzdots i, .qz-log li i { width: 10px; height: 10px; box-sizing: border-box; border: 1.5px solid var(--muted); border-radius: 50%; opacity: .55; position: relative; }
.qzdots i.ok, .qz-log li i.ok { background: var(--ok); border-color: var(--ok); opacity: 1; }
.qzdots i.ng, .qz-log li i.ng { border: 0; border-radius: 0; opacity: 1; }
.qzdots i.ng::before, .qzdots i.ng::after, .qz-log li i.ng::before, .qz-log li i.ng::after { content: ""; position: absolute; left: 4px; top: -1px; width: 2px; height: 12px; border-radius: 1px; background: var(--err); transform: rotate(45deg); }
.qzdots i.ng::after, .qz-log li i.ng::after { transform: rotate(-45deg); }
.pbar { flex: 1; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.pbar > span { display: block; height: 100%; background: var(--accent); }
.zone-empty { grid-column: 1 / -1; align-self: center; margin: 0; text-align: center; font-size: 13.5px; color: var(--muted); }
.card.dragging { opacity: .35; }
.card.ghost { position: fixed; left: 0; top: 0; z-index: 50; margin: 0; pointer-events: none; opacity: .92;
  border-color: var(--accent); box-shadow: 0 12px 30px rgba(0,0,0,.35); }

/* ---------- 読む画面 ---------- */
header.top { background: var(--panel); border-bottom: 1px solid var(--border); }
header.top .wrap { display: flex; align-items: center; gap: 8px 12px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.shelf-link { font-size: 13.5px; text-decoration: none; }
.brand { font-size: 17px; font-weight: 700; margin-right: auto; }
.shelf-link:hover { text-decoration: underline; }
.langs { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.langs button { font-size: 13px; padding: 3px 14px; border: 0; background: var(--panel); color: var(--muted); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }
.bar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); }
.bar > .wrap { display: flex; gap: 6px; padding-top: 8px; padding-bottom: 8px; }
.bar button { cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; }
.bar .step { width: 42px; flex: none; font-size: 14px; }
.bar .home { width: 42px; flex: none; display: grid; place-items: center; margin-right: 4px; font-size: 18px; line-height: 1; text-decoration: none;
  background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; }
.bar .home:hover { filter: brightness(1.05); box-shadow: 0 0 0 2px var(--accent-soft); }
@media (max-width: 480px) {   /* スマホでは、章の題を読める幅を残すため、まわりのボタンを細くする */
  .bar > .wrap { gap: 5px; }
  .bar .step, .bar .home { width: 36px; }
  .bar .home { margin-right: 2px; font-size: 17px; }
  #annoBtn { width: 38px; }
  #tocBtn { padding: 6px 10px; }
}
.bar .step:disabled { opacity: .4; cursor: default; }
#annoBtn { width: 46px; flex: none; font-size: 16px; }
#annoBtn.on { border-color: var(--accent); }
#tocBtn { flex: 1; min-width: 0; text-align: left; padding: 6px 12px; font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
#tocBtn .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tocBtn .caret { color: var(--muted); font-size: 12px; }
.drop { position: absolute; left: 0; right: 0; top: 100%; z-index: 11; }
.drop .wrap { display: block; }
.drop-in { background: var(--panel); border: 1px solid var(--border); border-radius: 0 0 12px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
  max-height: min(72vh, 660px); overflow: auto; padding: 6px 0 10px; }
.toc h3 { font-size: 12px; color: var(--muted); margin: 10px 16px 2px; font-weight: 700; letter-spacing: .03em; }
.toc .row { display: flex; align-items: center; }
.toc .row:hover { background: var(--bg); }
.toc .tg { flex: none; width: 34px; height: 34px; margin-left: 6px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 11px; cursor: pointer; }
.toc .tg:hover { color: var(--text); background: var(--th); }
.toc .ch { flex: 1; min-width: 0; text-align: left; font-size: 14.5px; padding: 6px 16px 6px 2px; border: 0; background: none; color: var(--text); cursor: pointer; }
.toc .row.on .ch { color: var(--accent); font-weight: 700; }
.toc .pin { margin-left: 6px; font-size: 12px; }
.toc .subs { padding: 0 0 6px; }
.toc .sub { display: block; width: 100%; text-align: left; font-size: 13.5px; padding: 4px 16px 4px 48px; border: 0; background: none; color: var(--muted); cursor: pointer; }
.toc .sub:hover { color: var(--text); background: var(--bg); }
main { padding-bottom: 30px; }
.msg { color: var(--muted); text-align: center; padding: 50px 0; }
.msg.err { color: var(--err); }

/* 本文 */
#body h1 { font-size: 24px; line-height: 1.5; margin: 26px 0 10px; }
#body h2 { font-size: 19px; margin: 34px 0 10px; padding-bottom: 4px; border-bottom: 2px solid var(--accent-soft); }
#body h3 { font-size: 16.5px; margin: 24px 0 6px; }
#body h4 { font-size: 15.5px; margin: 18px 0 4px; }
#body p { margin: 8px 0; }
#body ul, #body ol { margin: 8px 0; padding-left: 1.5em; }
#body li { margin: 3px 0; }
#body li ul { margin: 2px 0; }
#body hr { border: 0; border-top: 1px solid var(--border); margin: 22px 0; }
#body code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; background: var(--th); padding: 1px 5px; border-radius: 4px; }
#body img { display: block; max-width: 100%; height: auto; margin: 14px auto; border-radius: 10px; border: 1px solid var(--border); }
#body video, #body iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; margin: 12px 0; background: #000; }
#body figure { margin: 20px 0 22px; }
#body figure img { margin: 0 auto; cursor: zoom-in; }
#body figcaption { margin-top: 7px; font-size: 13px; line-height: 1.6; color: var(--muted); text-align: center; }
#body figcaption b { color: var(--text); margin-right: 6px; }
.tbl { overflow-x: auto; margin: 10px 0 14px; -webkit-overflow-scrolling: touch; }
#body table { border-collapse: collapse; font-size: 14px; line-height: 1.6; min-width: 100%; }
#body th, #body td { border: 1px solid var(--border); padding: 6px 10px; vertical-align: top; text-align: left; }
#body th { background: var(--th); white-space: nowrap; }
#body td { background: var(--panel); }
#body .bx { word-break: keep-all; overflow-wrap: break-word; }
#body td.bx.long { overflow-wrap: anywhere; }
#body td.bx.long code { overflow-wrap: break-word; }
#body blockquote { margin: 12px 0; padding: 8px 14px; background: var(--quote); border-left: 4px solid var(--quote-border); border-radius: 0 8px 8px 0; }
#body blockquote p { margin: 4px 0; }
.codeblock { margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.codeblock .cb-head { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--th);
  border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.6; }
.codeblock .cb-head .grow { flex: 1; }
.codeblock .cb-head button { padding: 1px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
.codeblock.run .cb-head { color: var(--ok); }
.codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto; background: var(--code-bg); line-height: 1.55; }
#body .codeblock pre code { border: 0; background: none; padding: 0; white-space: pre; font-size: 13px; }
#body .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
#body .katex { font-size: 1.08em; }
.quiz { margin: 12px 0 18px; }
.qz { margin: 10px 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
.qz.ok { border-color: var(--ok); } .qz.ng { border-color: var(--err); }
#body .qz-q { margin: 0 0 8px; }
.qz-q > b:first-child { margin-right: 6px; color: var(--accent); }
.qz pre.qz-code { margin: 6px 0 8px; padding: 8px 12px; overflow-x: auto; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; line-height: 1.55; }
#body .qz pre.qz-code code { border: 0; background: none; padding: 0; white-space: pre; font-size: 13px; }
.qz-row { display: flex; gap: 8px; }
.qz-in { flex: 1; min-width: 0; padding: 6px 10px; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
.qz-btn { padding: 6px 16px; font: inherit; font-size: 14px; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 6px; cursor: pointer; white-space: nowrap; }
.qz-res { margin-top: 8px; font-size: 14px; line-height: 1.7; }
/* 答えの履歴（折りたたみ。開くと新しい順に並ぶ） */
.qz-log { margin-top: 8px; font-size: 13px; color: var(--muted); }
.qz-log summary { display: flex; align-items: center; gap: 8px; width: fit-content; cursor: pointer; list-style: none; -webkit-user-select: none; user-select: none; }
.qz-log summary::-webkit-details-marker { display: none; }
.qz-log summary::before { content: "▸"; font-size: 11px; transition: transform .15s; }
.qz-log[open] summary::before { transform: rotate(90deg); }
.qz-log .qzdots { display: inline-flex; gap: 3px; }
#body .qz-log ol { list-style: none; margin: 6px 0 0; padding: 6px 0 0 2px; border-top: 1px dashed var(--border); max-height: 230px; overflow-y: auto; }
#body .qz-log li { display: flex; align-items: center; gap: 10px; margin: 0; padding: 3px 0; }
.qz-log li span { flex: 1; min-width: 0; color: var(--text); overflow-wrap: anywhere; }
.qz-log li time { white-space: nowrap; font-variant-numeric: tabular-nums; }
.qz-log li i { flex: none; }
#body .qz-res p { margin: 3px 0; }
.qz-mark { font-weight: bold; }
.qz.ok .qz-mark { color: var(--ok); } .qz.ng .qz-mark { color: var(--err); }
.listen { margin: 12px 0 16px; padding: 10px 12px; border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; background: var(--panel); }
.ls-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ls-bar b { margin-right: auto; font-size: 14px; }
.ls-bar button { padding: 5px 12px; font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
.ls-bar button.ls-play { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
.ls-bar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.ls-script { margin-top: 10px; padding-top: 6px; border-top: 1px dashed var(--border); }
#body .ls-script p { margin: 4px 0; }
.ls-script p.on { background: var(--accent-soft); border-radius: 4px; }
.ls-script b { margin-right: 6px; }
.wbk { margin: 10px 0 24px; }
.wtool { position: sticky; top: var(--barh, 58px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 -4px 12px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,.06); }
.wtool button { padding: 5px 11px; font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; white-space: nowrap; }
.wtool button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); font-weight: bold; }
.wn { display: inline-block; min-width: 1.4em; margin-left: 2px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--panel); font-size: 12px; font-weight: bold; text-align: center; }
.wt-q { flex: 1 1 150px; min-width: 0; padding: 5px 12px; font: inherit; font-size: 16px; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; }
.wgrp { margin: 18px 2px 8px; font-size: 13px; font-weight: bold; color: var(--accent); }
.wgrp:first-child { margin-top: 4px; }
.wtopics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.wtp { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-height: 76px; padding: 10px 12px; font: inherit; text-align: left; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
.wtp:hover { border-color: var(--accent); }
.wtp.last { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.wtp b { font-size: 14px; line-height: 1.45; }
.wtp small { display: flex; gap: 8px; margin-top: auto; font-size: 12px; color: var(--muted); }
.wtp small .c { color: var(--accent); font-weight: bold; }
.wtp small .r { color: var(--text); }
.wrbar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.wrd { flex: none; width: 22px; height: 22px; margin: 5px 0 0; accent-color: var(--accent); cursor: pointer; }
.whd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 2px 2px 10px; }
.whd h3 { margin: 0 !important; font-size: 17px; }
.whd span { font-size: 13px; color: var(--muted); }
.wct { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 2px 12px; }
.wct button { padding: 4px 10px; font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; }
.wct button small { margin-left: 4px; font-size: 12px; color: var(--muted); }
.wct button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); font-weight: bold; }
.wct button[aria-pressed="true"] small { color: var(--accent); }
.wmsg { padding: 18px 14px; font-size: 14px; color: var(--muted); text-align: center; background: var(--panel); border: 1px dashed var(--border); border-radius: 10px; }
.wl { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; }
.wr { display: flex; gap: 8px; padding: 9px 12px 10px 8px; border-top: 1px solid var(--border); }
.wr:first-child { border-top: 0; }
.wr.chk { background: var(--accent-soft); }
.wc { flex: none; width: 30px; height: 30px; margin-top: 1px; border: 2px solid var(--border); border-radius: 50%; background: var(--panel); color: transparent; font-size: 16px; line-height: 1; cursor: pointer; }
.wc:hover { border-color: var(--accent); }
.wr.chk .wc { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.wb { flex: 1; min-width: 0; }
.wh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.ww { font-size: 17px; }
.wp, .wtag { padding: 0 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.wtag { border-style: dashed; }
.ws { margin-left: auto; padding: 0 4px; border: 0; background: none; font-size: 15px; cursor: pointer; opacity: .7; }
.ws:hover { opacity: 1; }
#body .wm { margin-top: 2px; font-size: 15px; line-height: 1.6; }
#body .we { margin-top: 2px; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
#body .we strong { color: var(--text); }
#body.wl-hide .wr:not(.open) .wm, #body.wl-hide .wr:not(.open) .we { filter: blur(6px); opacity: .6; user-select: none; }
#body.wl-hide .wr:not(.open) .wb { cursor: pointer; }
.wpg { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin: 14px 0 6px; }
.wpg button { min-width: 38px; padding: 6px 10px; font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.wpg button[aria-current="page"] { color: var(--panel); background: var(--accent); border-color: var(--accent); font-weight: bold; }
.wpg button:disabled { opacity: .35; cursor: default; }
.wnext { display: block; width: 100%; margin-top: 8px; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; cursor: pointer; }
.term { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; cursor: help; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin: 36px 0 10px; }
.pager button { font-size: 14px; padding: 10px 14px; border-radius: 10px; cursor: pointer; max-width: 48%;
  border: 1px solid var(--border); background: var(--panel); color: var(--link); text-align: left; }
.pager button.next { margin-left: auto; text-align: right; }
.pager small { display: block; color: var(--muted); font-size: 12px; }

/* 言葉の説明 */

/* 付箋・線・メモ */

.c-green { --hl: var(--hl-green); --st: var(--st-green); } .c-blue { --hl: var(--hl-blue); --st: var(--st-blue); }
mark.hl { color: inherit; background: linear-gradient(transparent 40%, var(--hl) 40%); padding: 0; border-radius: 2px;
  cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
#body code mark.hl { background: var(--hl); }
mark.hl.note-end::after { content: "📝"; font-size: 11px; margin-left: 2px; vertical-align: super; line-height: 0; }
.sticky-bar { display: flex; align-items: center; gap: 8px; width: fit-content; max-width: 100%; margin: 12px 0 4px;
  padding: 2px 12px 2px 10px; background: var(--st); color: #1d2330; border-radius: 3px 12px 12px 3px;
  box-shadow: 0 1px 3px rgba(0,0,0,.3); font-size: 13px; font-weight: 600; line-height: 1.6; cursor: pointer; user-select: none; -webkit-user-select: none; }
.sticky-bar .st-date { font-size: 11px; font-weight: 400; opacity: .7; }
li > .sticky-bar { margin-top: 4px; }
.anno-flash { animation: annoFlash 1.8s ease-out; }
@keyframes annoFlash { 0%, 45% { outline: 3px solid var(--accent); outline-offset: 2px; } 100% { outline: 3px solid transparent; outline-offset: 2px; } }
#annoPop { position: fixed; z-index: 26; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px;
  background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.3); font-size: 13px; max-width: calc(100vw - 16px); }
#annoPop .ap-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

#annoPop textarea, #annoPop input[type=text] { font: inherit; font-size: 15px; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; width: min(320px, calc(100vw - 40px)); }
#annoPop textarea { resize: vertical; min-height: 64px; }
#annoPop .kbd { font-size: 11px; color: var(--muted); }
#annoPop button.sw { width: 26px; height: 26px; padding: 0; border-radius: 50%; background: var(--st); border: 2px solid transparent; }
#annoPop button.sw.on { border-color: var(--text); }
.notes .ap-ch { margin: 12px 14px 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.notes .ap-item { display: flex; align-items: stretch; gap: 2px; border-left: 4px solid var(--st); border-radius: 4px; margin: 2px 10px; }
.notes .ap-item:hover { background: var(--bg); }
.notes .ap-go { flex: 1; min-width: 0; border: 0; background: none; color: var(--text); text-align: left; padding: 5px 8px; cursor: pointer; font-size: 13.5px; line-height: 1.6; }
.notes .ap-go small { display: block; color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
.notes .ap-go small.lost { color: var(--warn); }
.notes .ap-del { border: 0; background: none; color: var(--muted); padding: 2px 10px; cursor: pointer; }
.notes .ap-del:hover { color: var(--err); }
.notes .empty { color: var(--muted); padding: 10px 14px; font-size: 13px; }
/* ログイン（本棚の右上。sync.js が中身を作る） */
.shelf-head .wrap { position: relative; }
.acct { position: absolute; top: 18px; right: 16px; z-index: 20; }
.acct-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; }
.acct-btn.on { color: var(--accent); border-color: var(--accent); }
.acct-btn.err { color: var(--err); border-color: var(--err); }
.acct-btn img { width: 22px; height: 22px; margin: -2px 0 -2px -6px; border-radius: 50%; }
.acct-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.acct-menu p { margin: 0 0 4px; font-size: 13px; word-break: break-all; }
.acct-menu p.m { color: var(--muted); font-size: 12px; }
.acct-form { display: flex; flex-direction: column; gap: 8px; width: min(300px, 86vw); }
.acct-form label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
.acct-form input { padding: 7px 10px; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
.acct-err { color: var(--err) !important; font-size: 12.5px !important; }
.acct-or { margin: 2px 0 0 !important; font-size: 12px !important; color: var(--muted); text-align: center; }
.acct-menu button.acct-google { width: 100%; margin-top: 0; padding: 7px 12px; font-weight: 700; }
.acct-row { display: flex; flex-wrap: wrap; gap: 6px; }
.acct-menu button.pri { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 700; }
.acct-menu button:disabled { opacity: .5; }
.acct-menu button { margin-top: 6px; padding: 5px 12px; font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
/* 今日の勉強（本棚の一番上）: 目標の輪・連続日数・カレンダー */
.today { margin: 18px -12px 0; padding: 14px 14px 12px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel); }
.td-top { display: flex; align-items: center; gap: 16px; }
.td-ring { position: relative; flex: none; width: 92px; height: 92px; }
.td-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.td-ring circle { fill: none; stroke-width: 9; }
.td-ring .bg { stroke: var(--border); }
.td-ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.td-ring .in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.2; }
.td-ring .in b { font-size: 21px; }

.td-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.td-streak { font-size: 18px; font-weight: 700; }
.td-streak small { margin-left: 6px; font-size: 12.5px; font-weight: 400; color: var(--muted); }
.td-msg { font-size: 13px; color: var(--muted); }
.td-goal { font-size: 12.5px; color: var(--muted); }

.td-cont { display: block; margin-top: 12px; padding: 9px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; text-decoration: none;
  color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; }
/* 旅（教科書をめぐる世界一周）: 地図と、着いた町の写真 */
.td-trip { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.td-trip-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; margin-bottom: 8px; font-size: 13.5px; }
.td-trip-h span { font-size: 12px; color: var(--muted); }
.td-map { position: relative; overflow: hidden; border-radius: 12px; background: color-mix(in srgb, #4a90c8 16%, var(--panel)); cursor: pointer; }
.td-map svg { display: block; width: 100%; }
.td-map .land { fill: color-mix(in srgb, var(--accent) 20%, var(--panel)); }
.td-map .lake { fill: color-mix(in srgb, #4a90c8 16%, var(--panel)); }
.td-map .rt { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 4; opacity: .7; }
.td-map .went { fill: none; stroke: #e8a317; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.td-map .st { fill: var(--muted); }
.td-map .st.v { fill: #e8a317; }
.td-map .st.n { fill: var(--panel); stroke: #e8a317; stroke-width: 2; }
.td-map .me { fill: #e8a317; stroke: #fff; stroke-width: 2; }
.td-map .ring { fill: #e8a317; transform-box: fill-box; transform-origin: center; animation: tdPulse 2s ease-out infinite; }
@keyframes tdPulse { from { transform: scale(1); opacity: .5; } to { transform: scale(3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .td-map .ring { animation: none; opacity: 0; } }
.td-map text { fill: var(--text); stroke: var(--panel); stroke-width: 3; paint-order: stroke; font-weight: 700; }
.td-map text.rg { fill: var(--muted); letter-spacing: .15em; }
.td-map text.dt { fill: var(--muted); font-weight: 600; }
.td-zoom { position: absolute; right: 8px; bottom: 8px; padding: 3px 10px; font: inherit; font-size: 12px; font-weight: 700; color: var(--text);
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 0; border-radius: 999px; cursor: pointer; }
.td-next { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 10px; margin-top: 6px; font-size: 12.5px; }
.td-next span { color: var(--muted); }
.td-towns { display: flex; gap: 8px; margin-top: 10px; padding-bottom: 2px; overflow-x: auto; }
.td-towns button { flex: none; width: 54px; padding: 0; font: inherit; color: var(--text); background: none; border: 0; cursor: pointer; }
.td-towns img { display: block; width: 46px; height: 46px; margin: 0 auto; border-radius: 50%; object-fit: cover; border: 2px solid #e8a317; }
.td-towns span { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10.5px; }
.td-towns .next img { filter: grayscale(1) blur(2px); opacity: .55; border: 2px dashed var(--muted); }
.td-towns .next span { color: var(--muted); }
.td-map .ft { fill: var(--panel); stroke: #e8a317; }
/* 旅日記: 勉強した日ごとに、もらった写真（目標に届いた日だけ）・日付・分の棒（目標に届いた日は金色）・着いた町 */
.td-log { margin-top: 12px; }
.td-log-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.td-log-h span { font-size: 12px; color: var(--muted); }
.td-log ol { list-style: none; margin: 4px 0 0; padding: 0; }
.td-log li { display: grid; grid-template-columns: 26px 2.9em 64px 3em minmax(0, 1fr); align-items: center; gap: 8px; padding: 2px 0; font-size: 12.5px; cursor: pointer; }
@media (min-width: 600px) { .td-log li { grid-template-columns: 26px 2.9em 140px 3em minmax(0, 1fr); } }
.td-log .g { width: 26px; height: 26px; }
.td-log .g img { display: block; width: 26px; height: 26px; border-radius: 6px; object-fit: cover; }
.td-album { padding: 0; font: inherit; font-size: 12px; font-weight: 700; color: var(--accent); background: none; border: 0; cursor: pointer; }
.album { position: fixed; inset: 0; z-index: 30; padding: 58px 12px 24px; overflow: auto; background: rgba(0, 0, 0, .93); color: #eee; }
.album-h { position: fixed; top: 0; left: 0; right: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(0, 0, 0, .85); font-size: 14px; }
.album-h .x { padding: 7px 16px; font: inherit; font-size: 14px; font-weight: 700; color: #111; background: #fff; border: 0; border-radius: 999px; cursor: pointer; }
.album-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px 8px; max-width: 900px; margin: 0 auto; }
.album-g button { min-width: 0; padding: 0; font: inherit; font-size: 11.5px; color: #ddd; background: none; border: 0; cursor: pointer; }
.album-g img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
.album-g span { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.album p { max-width: 900px; margin: 30px auto; text-align: center; font-size: 14px; }
.td-log .d { color: var(--muted); white-space: nowrap; }
.td-log .bar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
.td-log .bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.td-log .met .bar i { background: #e8a317; }
.td-log .m { text-align: right; white-space: nowrap; }
.td-log .w { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-more { display: block; margin: 4px auto 0; padding: 2px 14px; font: inherit; font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; }
.zoom.fit img { width: min(960px, 94vw); }
.zoom p a { color: #9cc9ff; }
.td-foot { margin-top: 8px; font-size: 12px; color: var(--muted); }
/* 目標に届いたときのお祝い */
#cheer { position: fixed; left: 50%; top: 50%; z-index: 60; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none; transition: transform .25s, opacity .25s;
  width: min(86vw, 340px); padding: 22px 20px 18px; text-align: center; background: var(--panel); border: 2px solid var(--accent); border-radius: 20px; box-shadow: 0 16px 50px rgba(0,0,0,.3); }
#cheer.on { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; cursor: pointer; }
#cheer .big { font-size: 44px; line-height: 1.1; }
#cheer b { display: block; margin-top: 8px; font-size: 18px; }
#cheer p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
#cheer img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; }
#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 40; padding: 8px 16px; border-radius: 10px;
  background: #333; color: #fff; font-size: 13.5px; display: none; max-width: calc(100vw - 32px); }
@media (max-width: 480px) { body { font-size: 15px; } #body h1 { font-size: 21px; } #body h2 { font-size: 17.5px; } #body table { font-size: 13px; } #body th, #body td { padding: 5px 7px; } }
</style>
</head>
<body>

<div id="shelf" hidden>
  <div class="shelf-head"><div class="wrap">
    <div class="acct" id="acct"></div>
    <h1>📚 教科書</h1>
    <p>興味あることを勉強するための教科書</p>
  </div></div>
  <div class="wrap"><section class="today" id="today" hidden></section></div>
  <main class="wrap shelf-main" id="books"><p class="msg">読み込み中…</p></main>
  <footer><div class="wrap"><p><a href="https://github.com/yusuke1090/textbooks" target="_blank" rel="noopener">GitHub</a> ・ <a href="https://yusuke1090.github.io/smart-agri-news/">スマート農業News</a></p></div></footer>
</div>

<div id="cheer" role="status" aria-live="polite"></div>
<div id="reader" hidden>
  <header class="top"><div class="wrap">
    <a class="shelf-link" id="shelfLink" href="./">📚 教科書</a>
    <span class="brand"><span id="bookIcon"></span> <span id="bookName"></span></span>
    <div class="langs" id="langs" role="group" aria-label="言語 / Language" hidden>
      <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div></header>
  <div class="bar">
    <div class="wrap">
      <a class="home" id="homeBtn" href="./" title="教科書の一覧に戻る" aria-label="教科書の一覧に戻る">📚</a>
      <button type="button" class="step" id="prev" aria-label="前の章">◀</button>
      <button type="button" id="tocBtn" aria-expanded="false"><span class="t" id="chTitle"></span><span class="caret">▼</span></button>
      <button type="button" class="step" id="next" aria-label="次の章">▶</button>
      <button type="button" id="annoBtn" aria-expanded="false" title="付箋・線・メモの一覧">🔖</button>
    </div>
    <div class="drop toc" id="toc" hidden><div class="wrap"><div class="drop-in" id="tocIn"></div></div></div>
    <div class="drop notes" id="notes" hidden><div class="wrap"><div class="drop-in" id="notesIn"></div></div></div>
  </div>

    <article id="body"><p class="msg">読み込み中…</p></article>
    <nav class="pager" id="pager"></nav>
  </main>

</div>

<div id="tip" role="tooltip"></div>
<div id="annoPop" hidden></div>
<div id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) {
      try { localStorage.setItem(k, v); } catch (e) {}
      const q = window.tbChanged || (window.tbChanged = []);   // sync.js（ログインしていればスマホと PC で合わせる）が受け取る
      if (!Array.isArray(q) || q.length < 2000) q.push([k, Date.now()]);
    },
  };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // ---------- 勉強した時間（毎日の目標・連続日数・カレンダー） ----------
  // textbooks-study: { days: { "YYYY-MM-DD": 秒 }, met: { "YYYY-MM-DD": 1 }（目標に届いた日）, goal: 分, cheer: お祝いを出した日 }
  const STUDY_LOG = "textbooks-study";
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  function loadStudy() {
    let s = null;
    try { s = JSON.parse(store.get(STUDY_LOG, "null")); } catch (e) { s = null; }
    s = s && typeof s === "object" ? s : {};
    s.days = s.days || {}; s.met = s.met || {}; s.goal = +s.goal || 15;
    return s;
  }
  const saveStudy = (s) => store.set(STUDY_LOG, JSON.stringify(s));
  // この端末の記録に、ほかの端末（ログインして合わせたとき）の記録を足したもの。目標に届いた日も、足した時間で決める
  function studyAll() {
    const own = loadStudy();
    let others = {};
    try { others = JSON.parse(store.get("textbooks-study-others", "{}")) || {}; } catch (e) { others = {}; }
    const days = { ...own.days }, met = { ...own.met }, goal = +store.get("textbooks-goal") || own.goal;
    Object.values(others).forEach((o) => {
      Object.entries((o && o.days) || {}).forEach(([k, v]) => { days[k] = (days[k] || 0) + v; });
      Object.assign(met, (o && o.met) || {});
    });
    Object.keys(days).forEach((k) => { if (days[k] >= goal * 60) met[k] = 1; });
    return { days, met, goal, own, devices: 1 + Object.keys(others).length };
  }
  function streakOf(s) {   // 目標に届いた日が、今日（まだなら昨日）から何日続いているか。最長も
    const d = new Date();
    if (!s.met[dayKey(d)]) d.setDate(d.getDate() - 1);
    let cur = 0;
    while (s.met[dayKey(d)]) { cur++; d.setDate(d.getDate() - 1); }
    let best = 0, run = 0, prev = null;
    Object.keys(s.met).sort().forEach((k) => {
      const t = new Date(k + "T12:00:00");
      run = prev && Math.round((t - prev) / 864e5) === 1 ? run + 1 : 1;
      best = Math.max(best, run); prev = t;
    });

  // カードのドラッグ（マウスは少し動かすと、指は長押しすると始まる）
  function setupDrag() {
    const root = $("books");
    let drag = null, mark = null, endedAt = 0;

    // 指の下が「今勉強中」のどこか。ref の前(after=false)か後ろに入れる
    function target(x, y) {
      const el = document.elementFromPoint(x, y), z = el && el.closest("#studying");
      if (!z) return { inZone: false };
      const c = el.closest(".card");
      if (!c) return { inZone: true };
      if (c === drag.card) return { inZone: true, self: true };
      const r = c.getBoundingClientRect(), oneCol = r.width > z.clientWidth * 0.6;
      return { inZone: true, ref: c, oneCol, after: oneCol ? y > r.top + r.height / 2 : x > r.left + r.width / 2 };
    }
    function start(card, x, y) {
      const r = card.getBoundingClientRect(), ghost = card.cloneNode(true);
      ghost.classList.add("ghost");
      ghost.style.width = r.width + "px"; ghost.style.height = r.height + "px";
      document.body.appendChild(ghost);
      drag = { card, id: card.dataset.id, ghost, dx: x - r.left, dy: y - r.top, x, y, raf: 0 };
      card.classList.add("dragging");
      document.body.classList.add("drag");
      move(x, y);
      drag.raf = requestAnimationFrame(autoScroll);
    }
    function move(x, y) {
      drag.x = x; drag.y = y;
      drag.ghost.style.transform = `translate(${x - drag.dx}px, ${y - drag.dy}px)`;
      const t = target(x, y);
      $("studying").classList.toggle("over", t.inZone);
      if (mark) mark.style.boxShadow = "";
      mark = t.ref || null;
      if (mark) mark.style.boxShadow = t.oneCol ? `0 ${t.after ? 4 : -4}px 0 var(--accent)` : `${t.after ? 4 : -4}px 0 0 var(--accent)`;
    }
    // 画面の上下の端に近づけると、そちらへ送る
    function autoScroll() {
      if (!drag) return;
      const edge = 70, y = drag.y, h = innerHeight;
      const v = y < edge ? -Math.ceil((edge - y) / 4) : y > h - edge ? Math.ceil((y - h + edge) / 4) : 0;
      if (v) { scrollBy(0, v); move(drag.x, drag.y); }
      drag.raf = requestAnimationFrame(autoScroll);
    }
    function end(drop) {
      const d = drag, t = drop ? target(d.x, d.y) : null;
      drag = null; mark = null; endedAt = Date.now();
      cancelAnimationFrame(d.raf);
      d.ghost.remove();
      document.body.classList.remove("drag");
      if (t && !t.self) {
        const list = studying.filter((id) => id !== d.id);
        if (t.inZone) {
          const i = t.ref ? list.indexOf(t.ref.dataset.id) + (t.after ? 1 : 0) : list.length;
          list.splice(i, 0, d.id);
        }
        studying = list;
        store.set(STUDY_KEY, JSON.stringify(studying));
      }
      renderShelf();
    }

    root.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "touch" || e.button !== 0) return;
      const card = e.target.closest(".card");
      if (!card) return;
      const sx = e.clientX, sy = e.clientY;
      const mv = (ev) => {
        if (!drag) { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return; start(card, sx, sy); }
        move(ev.clientX, ev.clientY);
      };
      const up = (ev) => {
        removeEventListener("pointermove", mv); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
        if (drag) end(ev.type === "pointerup");
      };
      addEventListener("pointermove", mv); addEventListener("pointerup", up); addEventListener("pointercancel", up);
    });

    root.addEventListener("touchstart", (e) => {
      const card = e.target.closest(".card");
      if (!card || e.touches.length !== 1 || drag) return;
      const sx = e.touches[0].clientX, sy = e.touches[0].clientY;
      let x = sx, y = sy;
      const timer = setTimeout(() => start(card, x, y), 400);
      const done = () => {
        clearTimeout(timer);
        removeEventListener("touchmove", mv); removeEventListener("touchend", up); removeEventListener("touchcancel", up);
      };
      const mv = (ev) => {
        x = ev.touches[0].clientX; y = ev.touches[0].clientY;
        if (drag) { ev.preventDefault(); move(x, y); }
        else if (Math.hypot(x - sx, y - sy) > 10) done();   // 長押しの前に動いたらスクロール
      };
      const up = (ev) => {
        done();
        if (drag) { ev.preventDefault(); end(ev.type === "touchend"); }
      };
      addEventListener("touchmove", mv, { passive: false });
      addEventListener("touchend", up, { passive: false }); addEventListener("touchcancel", up);
    }, { passive: true });

    // ドラッグの後のクリックで本を開かない
    root.addEventListener("click", (e) => { if (Date.now() - endedAt < 400) { e.preventDefault(); e.stopPropagation(); } }, true);
    root.addEventListener("contextmenu", (e) => { if (drag) e.preventDefault(); });
    root.addEventListener("dragstart", (e) => e.preventDefault());
  }

  // ---------- Markdown → HTML ----------
  function youtubeId(u) {
    const m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
  }
  function mediaHtml(alt, src) {
    const yt = youtubeId(src);
    if (yt) return `<iframe src="https://www.youtube-nocookie.com/embed/${yt}" title="${esc(alt)}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    if (/\.(mp4|webm)$/i.test(src)) return `<video src="${esc(url(src))}" controls preload="metadata" title="${esc(alt)}"></video>`;
    return `<img src="${esc(url(src))}" alt="${esc(alt)}" loading="lazy">`;
  }
  function inline(text) {
    const codes = [];
    text = text.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    text = esc(text);
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, u) => mediaHtml(a, u));
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, tx, u) => {
      const ext = /^https?:/.test(u);
      return `<a href="${esc(ext ? u : url(u))}"${ext ? ' target="_blank" rel="noopener"' : ""}>${tx}</a>`;
    });
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return text.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
  }

  // 練習問題（```quiz）。Q: 問題 / | コードの行 / A: 答え | 別の書き方 … / E: 解説。答えと解説は「回答」を押すまで隠す
  function quizHtml(lines, start) {
    const qs = [];
    let cur = null, last = "";
    for (const l of lines) {
      let m;
      if ((m = l.match(/^Q:\s*(.*)$/))) { cur = { q: m[1], code: [], a: [], e: "" }; qs.push(cur); last = "q"; }
      else if (!cur) continue;
      else if ((m = l.match(/^\|\s?(.*)$/))) cur.code.push(m[1]);
      else if ((m = l.match(/^A:\s*(.*)$/))) { cur.a = m[1].split(/\s+\|\s+/).map((x) => x.trim()).filter(Boolean); last = "a"; }
      else if ((m = l.match(/^E:\s*(.*)$/))) { cur.e = m[1]; last = "e"; }
      else if (l.trim() && last === "q") cur.q += " " + l.trim();
      else if (l.trim() && last === "e") cur.e += " " + l.trim();
    }
    const html = qs.map((x, k) => `<div class="qz" data-n="${start + k + 1}" data-a="${esc(JSON.stringify(x.a))}">`
      + `<p class="qz-q"><b>${t("qz")}${start + k + 1}</b>${inline(x.q)}</p>`

    return { html: `<div class="quiz">${html}</div>`, n: qs.length };

  // 英文の読み上げ（```listen、題は最初の「# 題」の行）。「名前: 文」の行は、名前ごとに声を変える。
  // スクリプトは「スクリプトを見る」を押すまで隠す（```listen show なら最初から見せる）
  function listenHtml(lines, n, show) {
    let title = "";
    const rows = [];
    for (const l of lines) {
      if (!l.trim()) continue;
      const h = l.match(/^#\s+(.*)$/);

      const m = l.match(/^([A-Z][\w .'-]{0,24}):\s+(.*)$/);

    return `<div class="listen" data-rows="${esc(JSON.stringify(rows))}"><div class="ls-bar"><b>${t("lsTitle")} ${n}${title ? "　" + inline(title) : ""}</b>`
      + `<button type="button" class="ls-play">${t("lsPlay")}</button><button type="button" class="ls-slow" aria-pressed="false">${t("lsSlow")}</button>`
      + `<button type="button" class="ls-show">${t(show ? "lsHide" : "lsShow")}</button></div>`
      + `<div class="ls-script"${show ? "" : " hidden"}>${script}</div></div>`;
  }
  // 単語帳（```words）。「## まとまり」「# 話題」の行と、1行に「単語 | 品詞 | 意味 | 例文」。
  // 画面には話題の一覧（カード）を出し、話題を選ぶと 20語ずつのページで見せる（initWords・drawWords）
  let wordBook = null;
  function wordsBox(lines, flags = []) {
    const groups = [], topics = [], all = [];
    const key = (w, ex) => { let h = 5381; for (const c of ex) h = (h * 33 + c.charCodeAt(0)) >>> 0; return w.toLowerCase() + "#" + h.toString(36); };
    for (const l of lines) {
      let m;
      if (!l.trim()) continue;
      if ((m = l.match(/^##\s+(.*)$/))) { groups.push({ name: m[1], topics: [] }); continue; }
      if ((m = l.match(/^#\s+(.*)$/))) {
        if (!groups.length) groups.push({ name: "", topics: [] });
        topics.push({ name: m[1], rows: [] });
        groups[groups.length - 1].topics.push(topics.length - 1);
        continue;
      }
      if (!topics.length) topics.push({ name: "", rows: [] });
      const [w = "", pos = "", mean = "", ex = ""] = l.split(/\s+\|\s+/);
      const r = { w, pos, mean, ex, k: key(w, ex), t: topics.length - 1, low: (w + " " + mean).toLowerCase() };
      topics[topics.length - 1].rows.push(r);
      all.push(r);
    }
    if (!groups.length) groups.push({ name: "", topics: topics.map((_, i) => i) });
    // ```words sw ならスワヒリ語の声で読む。audio があれば、端末の声ではなく audio/ の mp3 を鳴らす（tools/make_word_audio.py）
    wordBook = { groups, topics, all, lang: flags.find((f) => /^[a-z]{2}$/.test(f)) || "en", audio: flags.includes("audio") };
    return `<div class="wbk"><div class="wtool"><button type="button" data-wv="home">${t("wTopics")}</button>`
      + `<button type="button" data-wv="chk">${t("wChk")} <span class="wn">0</span></button>`
      + `<button type="button" class="wt-hide" aria-pressed="false">${t("wHide")}</button>`
      + `<input type="search" class="wt-q" placeholder="${t("wQ")}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>`
      + `<div class="wmain"></div></div>`;
  }
  function render(src, prefix) {
    const lines = src.replace(/\r\n/g, "\n").split("\n"), out = [], codes = [];
    let i = 0, m, fig = 0, qn = 0, ln = 0;
    const isSep = (l) => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
    const cells = (l) => l.trim().replace(/^\|/, "").replace(/(?<!\\)\|$/, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
    while (i < lines.length) {
      const line = lines[i];
      if ((m = line.match(/^```\s*(\w*)\s*(.*)$/))) {                      // コード
        const cl = m[1], flags = m[2].split(/\s+/), code = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) code.push(lines[i++]);
        i++;
        if (cl === "quiz") { const q = quizHtml(code, qn); qn += q.n; out.push(q.html); continue; }
        if (cl === "listen") { ln++; out.push(listenHtml(code, ln, flags.includes("show"))); continue; }
        if (cl === "words") { out.push(wordsBox(code, flags)); continue; }
        codes.push(code.join("\n"));
        const run = flags.includes("run") && (cl === "python" || cl === "cpp");
        out.push(`<div class="codeblock${run ? " run" : ""}"><div class="cb-head"><span class="grow">${esc(codeLabel(cl, flags))}</span>`
          + `<button type="button" data-copy="${codes.length - 1}">${t("copy")}</button></div>`
          + `<pre><code${cl === "bash" ? ' class="sh"' : ""}>${esc(code.join("\n"))}</code></pre></div>`);
        continue;
      }
      if (!line.trim()) { i++; continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
      if (/^\s*(---|\*\*\*)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
      if ((m = line.match(/^\s*!\[([^\]]*)\]\(([^)\s]+)\)\s*$/))) {          // 1行だけの画像は、番号と説明の付いた図にする
        if (youtubeId(m[2]) || /\.(mp4|webm)$/i.test(m[2])) { out.push(mediaHtml(m[1], m[2])); i++; continue; }
        fig++;
        const label = t("fig") + (prefix ? prefix + "-" : "") + fig;
        out.push(`<figure><img src="${esc(url(m[2]))}" alt="${esc(m[1])}" loading="lazy"><figcaption><b>${label}</b>${inline(m[1])}</figcaption></figure>`);
        i++; continue;
      }
      if (line.trim().startsWith("|") && i + 1 < lines.length && isSep(lines[i + 1])) {   // 表
        const head = cells(line), rows = [];
        i += 2;
        while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
        out.push('<div class="tbl"><table><thead><tr>' + head.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>"
          + rows.map((r) => "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table></div>");
        continue;
      }
      if (/^>\s?/.test(line)) {                                             // 引用（注意書き）
        const q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
        out.push("<blockquote>" + q.filter((l) => l.trim()).map((l) => `<p>${inline(l)}</p>`).join("") + "</blockquote>");
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {                               // 箇条書き・番号付き
        const ordered = /^\s*\d+\./.test(line), start = ordered ? parseInt(line.trim(), 10) : 1, items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^\s{2,}/.test(lines[i])) {
          let item = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "");
          const subs = [];
          while (i < lines.length && /^\s{2,}\S/.test(lines[i])) {
            if (/^\s{2,}([-*]|\d+\.)\s+/.test(lines[i])) subs.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
            else if (subs.length) subs[subs.length - 1] += " " + lines[i++].trim();
            else item += " " + lines[i++].trim();
          }
          items.push(`<li>${inline(item)}${subs.length ? "<ul>" + subs.map((s) => `<li>${inline(s)}</li>`).join("") + "</ul>" : ""}</li>`);
        }
        out.push(ordered ? `<ol${start > 1 ? ` start="${start}"` : ""}>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
        continue;
      }
      const para = [];                                                      // 段落
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\s*([-*]|\d+\.)\s+|\s*\||\s*!\[)/.test(lines[i])) para.push(inline(lines[i++].trim()));
      if (para.length) out.push(`<p>${para.join("<br>")}</p>`);
      else out.push(`<p>${inline(lines[i++])}</p>`);
    }
    return { html: out.join("\n"), codes };
  }
  // 章の見出し（##）と、ページの見出し（h1〜h4）の中での番号。コードの中の # は数えない
  function outline(md) {
    const res = [];
    let n = 0, fence = false;
    for (const l of md.split("\n")) {
      if (/^```/.test(l)) { fence = !fence; continue; }
      if (fence) continue;
      const m = l.match(/^(#{1,4})\s+(.*)$/);
      if (!m) continue;
      if (m[1].length === 2) res.push({ h: n, text: m[2].replace(/\*\*|`/g, "") });
      n++;
    }
    return res;
  }

  // ---------- 読んでいる場所（見出しの番号と、その節の中の割合） ----------
  const headings = () => [...body.querySelectorAll("h1, h2, h3, h4")];
  const topLine = () => bar.getBoundingClientRect().bottom + 8;
  function anchor() {
    const hs = headings(), line = topLine();
    let h = 0;
    for (let k = 0; k < hs.length; k++) { if (hs[k].getBoundingClientRect().top <= line) h = k; else break; }
    if (!hs.length) return { h: 0, r: 0 };
    const a = hs[h].getBoundingClientRect().top, b = hs[h + 1] ? hs[h + 1].getBoundingClientRect().top : body.getBoundingClientRect().bottom;
    const r = b > a ? Math.max(0, Math.min(1, (line - a) / (b - a))) : 0;
    return { h, r: Math.round(r * 1000) / 1000 };
  }
  function goAnchor(p) {
    const hs = headings();
    if (!p || !hs[p.h] || (p.h === 0 && !p.r)) { window.scrollTo(0, 0); return; }
    const a = hs[p.h].getBoundingClientRect().top + scrollY;
    const b = hs[p.h + 1] ? hs[p.h + 1].getBoundingClientRect().top + scrollY : body.getBoundingClientRect().bottom + scrollY;
    window.scrollTo(0, Math.max(0, a + (b - a) * (p.r || 0) - topLine()));
  }
  let saveTimer = 0;
  function savePos() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const a = anchor();
      store.set(POS_KEY(), JSON.stringify({ idx: state.idx, lang: state.lang, h: a.h, r: a.r }));
    }, 250);
  }
  // 図が読み込まれて高さが変わっても、自分でスクロールするまでは同じ場所に合わせ直す
  let userMoved = false, keepUntil = 0;
  ["wheel", "touchstart", "keydown", "mousedown"].forEach((ev) => addEventListener(ev, () => { userMoved = true; }, { passive: true }));
  function keepAnchor(pos) {
    if (!pos) return;
    userMoved = false;
    keepUntil = Date.now() + 4000;
    body.querySelectorAll("img").forEach((img) => {
      if (!img.complete) img.addEventListener("load", () => { if (!userMoved && Date.now() < keepUntil) goAnchor(pos); });
    });
  }

  // ---------- 数式（books.json で "math": true の教科書だけ。$…$ と $$…$$ を KaTeX で表示する） ----------
  const KATEX = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/";
  let katexReady = null;
  function loadScript(src) {
    return new Promise((ok, ng) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = ng; document.head.appendChild(el); });
  }
  function ensureKatex() {
    if (!katexReady) {
      const css = document.createElement("link");
      css.rel = "stylesheet"; css.href = KATEX + "katex.min.css";
      document.head.appendChild(css);
      katexReady = loadScript(KATEX + "katex.min.js").then(() => loadScript(KATEX + "contrib/auto-render.min.js"));
    }
    return katexReady;
  }
  async function renderMath() {
    if (!book.math) return;
    try {
      await ensureKatex();
      window.renderMathInElement(body, {
        delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }],
        ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"], throwOnError: false,
      });
    } catch (e) { /* 読み込めないときは、数式をそのままの文字で出す */ }
  }

  // ---------- 表・見出し・図の説明を、日本語の文節の切れ目で折り返す（BudouX。「キリス／ト教」のように単語の途中で切らない） ----------
  const BUDOUX = "https://cdn.jsdelivr.net/npm/budoux@0.10.0/module/";
  let phraser = null, phraserReady = null;
  function ensurePhraser() {
    if (!phraserReady) phraserReady = Promise.all([import(BUDOUX + "parser.js"), import(BUDOUX + "data/models/ja.js")])
      .then(([p, m]) => { phraser = new p.Parser(m.model); }).catch(() => {});
    return phraserReady;
  }
  function phraseBreaks() {
    if (!phraser || state.lang !== "ja") return;
    body.querySelectorAll("th, td, h1, h2, h3, h4, figcaption").forEach((el) => {
      const nodes = [], starts = [];
      let text = "";
      const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      for (let n; (n = w.nextNode());) { nodes.push(n); starts.push(text.length); text += n.data; }
      if (!/[぀-ヿ㐀-鿿]/.test(text)) return;
      el.classList.add("bx");
      if (/^[぀-ゟー]+$/.test(text.trim())) return;   // ひらがなだけ（読みがな）は1つの言葉として切らない
      const cut = new Set(phraser.parseBoundaries(text));
      for (let i = 1; i < text.length; i++) if (text[i - 1] === "・" && !/[・、。）」]/.test(text[i])) cut.add(i);   // 「中国・北朝鮮・日本」の並び
      [...cut].sort((a, b) => b - a).forEach((b) => {
        const pair = text[b - 1] + text[b];
        if (/\s|\w\w|[〜～]/.test(pair) || /[ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶー々]/.test(text[b])) return;   // 空白は元から切れる。英数字の途中・「4〜6割」・小さい「ゅ」などの前では切らない
        let k = nodes.length - 1;
        while (k > 0 && starts[k] > b) k--;
        const n = nodes[k];
        if (n.parentElement.closest("code, .katex")) return;
        const off = b - starts[k];
        if (off >= n.data.length) return;
        n.parentNode.insertBefore(document.createElement("wbr"), off ? n.splitText(off) : n);
      });
    });
    fitTables();
  }
  // 表が横にはみ出すときだけ、長い文の列から順に、文節の途中でも折り返してよいことにする（短い言葉の列はなるべく切らない）
  function fitTables() {
    if (!phraser || state.lang !== "ja") return;
    body.querySelectorAll(".tbl").forEach((w) => {
      const tb = w.firstElementChild, fits = () => w.scrollWidth <= w.clientWidth + 1;
      tb.querySelectorAll("td.long").forEach((x) => x.classList.remove("long"));
      if (fits()) return;
      const rows = [...tb.tBodies[0].rows], len = (cells) => Math.max(0, ...cells.map((x) => x.textContent.length));
      const cols = [...tb.rows[0].cells].map((_, c) => rows.map((r) => r.cells[c]).filter(Boolean)).sort((a, b) => len(b) - len(a));
      for (const cells of cols) {
        cells.forEach((x) => x.classList.add("long"));
        if (fits()) break;
      }
    });
  }
  let fitTimer = 0, fitW = innerWidth;
  addEventListener("resize", () => {
    if (innerWidth === fitW) return;
    fitW = innerWidth; clearTimeout(fitTimer); fitTimer = setTimeout(fitTables, 200);
  });

  const pickGlossary = () => { glossary = state.lang === "en" && glossaries.en ? { ...glossaries.ja, ...glossaries.en } : glossaries.ja || {}; };

  // ---------- 章を出す ----------
  let showSeq = 0, codes = [];
  async function show(idx, lang, pos) {
    const seq = ++showSeq;
    state.idx = Math.max(0, Math.min(chapters.length - 1, idx));
    state.lang = book.langs.includes(lang) ? lang : book.langs[0];
    pickGlossary();
    const ch = chapters[state.idx];
    document.documentElement.lang = state.lang;
    $("bookName").textContent = L(book.title, state.lang);
    document.title = L(ch.title, state.lang) + (state.lang === "en" ? " | " : "｜") + L(book.title, state.lang);
    $("shelfLink").textContent = t("shelf");
    $("homeBtn").title = t("home");
    $("homeBtn").setAttribute("aria-label", t("home"));
    $("footNote").textContent = L(book.note, state.lang);
    $("prev").setAttribute("aria-label", t("prev")); $("next").setAttribute("aria-label", t("next"));
    document.querySelectorAll("#langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === state.lang ? "true" : "false"));
    $("chTitle").textContent = L(ch.title, state.lang);
    $("prev").disabled = state.idx === 0;
    $("next").disabled = state.idx === chapters.length - 1;
    closeDrops(); hideTip(); closePop(); stopSpeech();
    let md;
    try { md = await loadMd(state.idx, state.lang); }
    catch (e) { body.innerHTML = `<p class="msg err">${t("loadErr")}（${esc(e.message)}）</p>`; return; }
    if (seq !== showSeq) return;
    const r = render(md, figPrefix(ch));
    if (!/```words/.test(md)) wordBook = null;
    body.innerHTML = r.html;
    codes = r.codes;
    initWords();
    fillQuizLogs();
    await renderMath();
    if (seq !== showSeq) return;
    markTerms();
    if (state.lang === "ja") {
      await Promise.race([ensurePhraser(), new Promise((ok) => setTimeout(ok, 1500))]);
      if (seq !== showSeq) return;
      phraseBreaks();
    }
    const prev = chapters[state.idx - 1], next = chapters[state.idx + 1];
    $("pager").innerHTML =
      (prev ? `<button type="button" data-go="${state.idx - 1}"><small>◀ ${esc(t("prev"))}</small>${esc(L(prev.title, state.lang))}</button>` : "") +
      (next ? `<button type="button" class="next" data-go="${state.idx + 1}"><small>${esc(t("next"))} ▶</small>${esc(L(next.title, state.lang))}</button>` : "");
    const h = "#ch=" + state.idx + (book.langs.length > 1 && state.lang !== book.langs[0] ? "&lang=" + state.lang : "");
    if (location.hash !== h) history.replaceState(null, "", location.pathname + location.search + h);
    applyAnno();
    goAnchor(pos);
    keepAnchor(pos);
    savePos();
  }

  // ---------- 目次（章ごとに ▶ で見出しを開く） ----------
  const openSet = {};
  const outlines = {};
  async function buildToc() {
    let html = "", part = "";
    chapters.forEach((c, i) => {
      if (L(c.part, state.lang) !== part) { part = L(c.part, state.lang); html += `<h3>${esc(part)}</h3>`; }
      const on = !!openSet[i];
      html += `<div class="row${i === state.idx ? " on" : ""}"><button type="button" class="tg" data-tg="${i}" aria-expanded="${on}">${on ? "▼" : "▶"}</button>`
        + `<button type="button" class="ch" data-go="${i}">${esc(L(c.title, state.lang))}${pinBadge(c.file)}</button></div>`;
      if (on) {
        const o = outlines[state.lang + i];
        html += '<div class="subs">' + (o ? o.map((x) => `<button type="button" class="sub" data-go="${i}" data-h="${x.h}">${esc(x.text)}</button>`).join("")
          : `<span class="sub">${t("load")}</span>`) + "</div>";
      }
    });
    $("tocIn").innerHTML = html;
    // 開いている章の見出しを読み込んでいなければ、読み込んでから作り直す
    const need = Object.keys(openSet).filter((i) => openSet[i] && !outlines[state.lang + i]);
    if (need.length) {
      await Promise.all(need.map((i) => loadMd(+i, state.lang).then((md) => { outlines[state.lang + i] = outline(md); }).catch(() => { outlines[state.lang + i] = []; })));
      if (!$("toc").hidden) { const top = $("tocIn").scrollTop; buildToc(); $("tocIn").scrollTop = top; }
    }
  }
  function closeDrops() {
    $("toc").hidden = true; $("tocBtn").setAttribute("aria-expanded", "false");
    $("notes").hidden = true; $("annoBtn").classList.remove("on"); $("annoBtn").setAttribute("aria-expanded", "false");
  }
  $("tocBtn").addEventListener("click", () => {
    if (!$("toc").hidden) return closeDrops();
    closeDrops();
    openSet[state.idx] = true;
    buildToc();
    $("toc").hidden = false; $("tocBtn").setAttribute("aria-expanded", "true");
    const on = $("tocIn").querySelector(".row.on");
    if (on) $("tocIn").scrollTop = Math.max(0, on.offsetTop - 60);
  });
  $("tocIn").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.tg) {
      const k = +b.dataset.tg, top = $("tocIn").scrollTop;
      openSet[k] = !openSet[k];
      buildToc();
      $("tocIn").scrollTop = top;
      return;
    }
    const go = +b.dataset.go, pos = b.dataset.h ? { h: +b.dataset.h, r: 0 } : null;
    if (go === state.idx && pos) { closeDrops(); goAnchor(pos); savePos(); }
    else show(go, state.lang, pos);
  });
  $("prev").addEventListener("click", () => show(state.idx - 1, state.lang, null));
  $("next").addEventListener("click", () => show(state.idx + 1, state.lang, null));
  $("pager").addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) show(+b.dataset.go, state.lang, null); });
  document.querySelectorAll("#langs button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.lang === state.lang) return;
    store.set("textbooks-lang-" + book.id, b.dataset.lang);
    show(state.idx, b.dataset.lang, anchor());          // 同じ見出しの、同じくらいの所を出す
  }));
  addEventListener("scroll", () => { savePos(); hideTip(); if (pop.dataset.kind === "sel") placeSelBar(); }, { passive: true });
  addEventListener("hashchange", () => {
    const h = fromHash();
    if (h && (h.idx !== state.idx || (h.lang && h.lang !== state.lang))) show(h.idx, h.lang || state.lang, null);
  });
  function fromHash() {
    const m = location.hash.match(/ch=(\d+)/), l = location.hash.match(/lang=(\w+)/);
    return m ? { idx: +m[1], lang: l ? l[1] : null } : null;
  }

  // ---------- コピー・図を大きく ----------
  let zoomEl = null;
  function closeZoom() { if (zoomEl) { zoomEl.remove(); zoomEl = null; document.body.style.overflow = document.querySelector(".album") ? "hidden" : ""; } }
  function openZoom(img) {
    const cap = img.parentNode.querySelector("figcaption"), lab = cap ? cap.querySelector("b").textContent : "";
    showZoom(img.getAttribute("src"), cap ? `<b>${esc(lab)}</b>　${esc(cap.textContent.slice(lab.length))}` : "", false, img.alt);
  }
  function showZoom(src, capHtml, fit, alt = "") {   // fit: 画面の幅に合わせる（写真）。図は 820px のまま広げて読む
    closeZoom();
    zoomEl = document.createElement("div");

    zoomEl.innerHTML = `<button type="button" class="x">✕ ${t("close")}</button><img src="${esc(src)}" alt="${esc(alt)}"><p>${capHtml}</p>`;
    zoomEl.addEventListener("click", (ev) => { if (ev.target === zoomEl || ev.target.closest(".x")) closeZoom(); });

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); }

  // =====================================================================
  // 言葉の説明（コードの単語: glossary.json、本文の用語: terms.json）
  // =====================================================================
  const tipEl = $("tip");
  function wordAt(text, pos) {
    let s = pos, e = pos;
    while (s > 0 && /\w/.test(text[s - 1])) s--;
    while (e < text.length && /\w/.test(text[e])) e++;
    return s === e ? null : { word: text.slice(s, e), start: s, end: e };
  }
  function enclosingCall(text, pos) {
    let depth = 0;
    for (let i = pos - 1; i >= 0; i--) {
      const c = text[i];
      if (")]}".includes(c)) depth++;
      else if ("([{".includes(c)) {
        if (depth > 0) { depth--; continue; }
        if (c !== "(") return null;
        const m = text.slice(0, i).match(/([A-Za-z_][\w.]*)\s*$/);
        return m ? m[1] : null;
      }
    }
    return null;
  }
  function headerTip(name, label) {
    const v = glossary[`#include <${name.trim()}>`];
    return typeof v === "string" ? { label, kind: "ヘッダー", text: v, code: true } : null;
  }
  function includeAt(text, pos) {
    const start = text.lastIndexOf("\n", pos - 1) + 1, nl = text.indexOf("\n", pos);
    const line = text.slice(start, nl < 0 ? text.length : nl);
    const m = line.match(/^(\s*#\s*include\s*)(<([^>]*)>|"([^"]*)")/);
    if (!m) return null;
    const p = pos - start, s = m[1].length, e = s + m[2].length;
    return p >= s && p <= e ? { name: m[3] ?? m[4], label: "#include " + m[2] } : null;
  }
  function lookupAt(text, pos) {
    const inc = includeAt(text, pos);
    if (inc) return headerTip(inc.name, inc.label);
    const w = wordAt(text, pos);
    if (!w || /^\d/.test(w.word)) return null;
    const isKwarg = /^\s*=(?!=)/.test(text.slice(w.end));
    const fn = isKwarg ? enclosingCall(text, w.start) : null;
    const owner = text.slice(0, w.start).match(/([A-Za-z_]\w*)\.$/);
    const cands = [];
    if (fn) cands.push({ key: fn.split(".").pop() + "." + w.word, kind: "引数", label: `${fn}( ${w.word}= )` });
    if (owner) cands.push({ key: owner[1] + "." + w.word, kind: "", label: owner[1] + "." + w.word });
    cands.push({ key: w.word, kind: fn ? "引数" : /^\s*\(/.test(text.slice(w.end)) ? "関数" : "", label: fn ? `${fn}( ${w.word}= )` : w.word });
    for (const c of cands) if (typeof glossary[c.key] === "string") return { ...c, text: glossary[c.key], code: true };
    return null;
  }
  function shellKey(s) {
    if (/^\/dev\/ttyACM/.test(s)) return "/dev/ttyACM0";
    if (/\.uf2$/.test(s)) return "*.uf2";

        ${it.type === "sticky" || it.note ? quote : `<small>${fmtDate(it.created)}</small>`}${lost}</button>

  // ---------- 単語帳: 話題の一覧・20語ずつのページ・チェック・見直す・探す ----------
  const WORDS_KEY = () => "textbooks-words-" + book.id;          // チェックした単語の鍵（単語＋例文）。日本語版と英語版で同じ

  function initWords() {

  const topicShort = (i) => wordBook.topics[i].name.replace(/\s*[（(:：].*$/, "");

  // 単語を読む声。英語はいつも読める（声がなければ端末の標準）。ほかの言葉は、その言葉の声があるときだけ（false なら 🔊 を出さない）

  // audio/ の mp3 を鳴らす（ファイルの名前は、単語を小文字にして a-z・0-9 以外を「-」にしたもの。make_word_audio.py の slug と同じ）

  if (speech && speech.addEventListener) speech.addEventListener("voiceschanged", () => { if (wordBook && wordBook.lang !== "en" && !wordBook.audio) drawWords(); });

  // ---------- 練習問題の答え合わせ ----------
  // 全角・半角、大文字・小文字、カタカナ・ひらがな、空白や「」、などの記号、文の終わりの「です」のちがいは見ない。
  // 答えが数なら、入力の中の最初の数で比べる（「280日」「２８０」でもよい）
  function qzNorm(s) {
    s = String(s).normalize("NFKC").toLowerCase().trim().replace(/^(the|an?)\s+/, "");
    s = s.replace(/[\u30a1-\u30f6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));

    return m ? m[0] : null;

  function qzMatch(input, answers) {
    // 記号だけの答え（[] や @ など）は、記号を消すと空になるので、空白だけを除いて比べる
    const norm = (x) => qzNorm(x) || String(x).normalize("NFKC").toLowerCase().replace(/\s/g, "");
    const v = norm(input), sing = (x) => (x.length > 3 ? x.replace(/s$/, "") : x);
    if (!v) return false;
    return answers.some((a) => {
      const an = String(a).normalize("NFKC").replace(/(\d),(?=\d{3})/g, "$1").replace(/[−–]/g, "-").trim();
      if (NUM.test(an)) {
        const x = qzNum(input);
        if (x === null) return false;
        const d = (an.split(".")[1] || "").length;
        return +x === +an || (d > 0 && (+x).toFixed(d) === (+an).toFixed(d));

      return v === w || sing(v) === sing(w) || qzHas(input, a);
    });

  function qzLoose(s) {

  // { "章のファイル#問の番号": [[時刻, 1 正解 / 0 不正解, "入れた答え"], …] }。問題ごとに新しい30回まで
  const LOG_KEY = (id) => "textbooks-quizlog-" + id;
  const qzKey = (q) => chapters[state.idx].file + "#" + q.dataset.n;
  function readLog() {
    try { return JSON.parse(store.get(LOG_KEY(book.id), "{}")) || {}; } catch (e) { return {}; }
  }
  function stamp(ms) {
    const d = new Date(ms), p = (x) => String(x).padStart(2, "0");
    return (d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + "/" : "")
      + `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function showQuizLog(q, list) {
    let el = q.querySelector(".qz-log");
    if (!list || !list.length) { if (el) el.remove(); return; }
    const en = state.lang === "en", open = !!(el && el.open);
    if (!el) { el = document.createElement("details"); el.className = "qz-log"; q.appendChild(el); }
    // 閉じているときは回数と、最近10回の ● × を見せる
    el.innerHTML = `<summary>${en ? "Your answers" : "これまでの答え"}<span>${list.length}${en ? "" : " 回"}</span>`
      + `<span class="qzdots">${list.slice(-10).map((x) => `<i class="${x[1] ? "ok" : "ng"}"></i>`).join("")}</span></summary>`
      + `<ol>${list.slice().reverse().map((x) => `<li><i class="${x[1] ? "ok" : "ng"}"></i><span>${esc(x[2])}</span><time>${stamp(x[0])}</time></li>`).join("")}</ol>`;
    el.open = open;
  }
  function fillQuizLogs() {
    if (!body.querySelector(".qz")) return;
    const log = readLog();
    body.querySelectorAll(".qz").forEach((q) => showQuizLog(q, log[qzKey(q)]));
  }
  function checkQuiz(q) {
    const inp = q.querySelector(".qz-in");
    if (!inp.value.trim()) { inp.focus(); return; }
    let ans = [];
    try { ans = JSON.parse(q.dataset.a); } catch (e) { ans = []; }
    const ok = qzMatch(inp.value, ans);
    q.classList.toggle("ok", ok); q.classList.toggle("ng", !ok);
    q.querySelector(".qz-mark").textContent = t(ok ? "qzOk" : "qzNg");
    q.querySelector(".qz-res").hidden = false;
    // 入れた答えは毎回 履歴に残す（同じ画面で同じ答えのまま もう一度押したときは残さない）
    const v = inp.value.trim().slice(0, 200);
    if (q.dataset.last !== v) {
      q.dataset.last = v;
      const log = readLog(), k = qzKey(q);
      log[k] = (log[k] || []).concat([[Date.now(), ok ? 1 : 0, v]]).slice(-30);
      store.set(LOG_KEY(book.id), JSON.stringify(log));
      showQuizLog(q, log[k]);
    }
    // 正答率に使うのは、この画面で最初に答えたときだけ（答えを見たあとの入れ直しは数えない）
    if (q.dataset.done) return;
    q.dataset.done = "1";
    let res = {};
    try { res = JSON.parse(store.get(QUIZ_KEY(book.id), "{}")) || {}; } catch (e) { res = {}; }
    res[chapters[state.idx].file + "#" + q.dataset.n] = ok ? 1 : 0;
    store.set(QUIZ_KEY(book.id), JSON.stringify(res));
  }
  body.addEventListener("click", (e) => {
    if (wordsClick(e)) return;
    const b = e.target.closest(".qz-btn");
    if (b) checkQuiz(b.closest(".qz"));
    const ls = e.target.closest(".listen button");
    if (!ls) return;
    const box = ls.closest(".listen");
    if (ls.classList.contains("ls-play")) playListen(box);
    else if (ls.classList.contains("ls-slow")) ls.setAttribute("aria-pressed", ls.getAttribute("aria-pressed") === "true" ? "false" : "true");
    else if (ls.classList.contains("ls-show")) {
      const sc = box.querySelector(".ls-script");
      sc.hidden = !sc.hidden;
      ls.textContent = t(sc.hidden ? "lsShow" : "lsHide");
    }
  });
  body.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing && e.target.classList.contains("qz-in")) { e.preventDefault(); checkQuiz(e.target.closest(".qz")); }
  });

  // ---------- 本文を押したとき ----------
  body.addEventListener("click", (e) => {
    if (!getSelection().isCollapsed) return;
    const cp = e.target.closest("[data-copy]");
    if (cp) return copyText(codes[+cp.dataset.copy]);
    const img = e.target.closest("figure img");
    if (img) return openZoom(img);
    const sticky = e.target.closest(".sticky-bar");
    if (sticky) return editSticky(sticky.dataset.id);
    const term = e.target.closest(".term");
    if (term) { termTip(term, e); return; }
    const codeEl = e.target.closest("code");
    if (codeEl && codeTip(codeEl, e)) return;
    const m = e.target.closest("mark.hl");
    if (m && !e.target.closest("a")) return editMark(m.dataset.id);
    hideTip();
  });
  document.addEventListener("click", (e) => {
    if (!e.target.isConnected) return;
    if (!e.target.closest(".bar") && (!$("toc").hidden || !$("notes").hidden)) closeDrops();
    if (!e.target.closest("#body, #tip")) hideTip();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    closeZoom(); hideTip(); closeDrops();
    if (!pop.hidden) closePop();
  });

  // ---------- はじめに ----------
  // 読んでいる時間を数える（画面が見えていて、5分以内に教科書を操作したときか、読み上げ中だけ。10秒ごと）
  // ほかの窓（VS Code やターミナル）を触っていても、教科書が画面に出ていれば数える
  let lastAct = Date.now();
  ["scroll", "pointerdown", "pointermove", "keydown", "touchstart", "wheel", "input"].forEach((ev) => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
  setInterval(() => {
    if (!book || document.hidden) return;
    if (Date.now() - lastAct > 300000 && !(window.speechSynthesis && speechSynthesis.speaking)) return;
    const s = loadStudy(), k = dayKey();
    s.days[k] = (s.days[k] || 0) + 10;
    saveStudy(s);
    const all = studyAll();                    // ほかの端末の時間も足して、目標に届いたかを見る
    if ((all.days[k] || 0) >= all.goal * 60 && !s.met[k]) s.met[k] = 1;
    const cheerNow = s.met[k] && s.cheer !== k;
    if (cheerNow) s.cheer = k;
    saveStudy(s);
    if (cheerNow) cheer(studyAll());
    if (trip) {                                // 旅: この10秒で次の町に着いたら、その町の写真を出す
      const now = studyTotal(all), p = tripAt(now);
      if (p.n > tripAt(now - 10).n) arrive(p);
    }
  }, 10000);
  // お祝いは1つずつ順に出す（押すか、時間がたつと消える）
  const pops = [];
  let popOn = false;
  function popup(html, ms) { pops.push([html, ms]); if (!popOn) nextPop(); }
  function nextPop() {
    const el = $("cheer"), q = pops.shift();
    if (!q) { popOn = false; return; }
    popOn = true;
    el.innerHTML = q[0];
    el.classList.add("on");
    let done = false;
    const off = () => { if (done) return; done = true; el.classList.remove("on"); setTimeout(nextPop, 400); };
    el.onclick = off;
    setTimeout(off, q[1]);
  }
  function cheer(s) {
    const st = streakOf(s), en = state.lang === "en";
    popup(`<div class="big">🎉</div><b>${en ? `Today's goal reached: ${s.goal} min` : `今日の目標 ${s.goal}分 達成！`}</b>`
      + `<p>🔥 ${en ? `${st.cur}-day streak` : `${st.cur}日連続`}${st.cur > 1 && st.cur >= st.best ? (en ? " — your best!" : "（最長記録）") : ""}</p>`, 5000);
  }
  function arrive(p) {
    const en = state.lang === "en", S = trip.stops, home = p.i === 0, q = home ? S[S.length - 1] : S[p.i], nx = S[p.i + 1], nm = (x) => esc(en ? x.en : x.ja);
    const head = home ? (en ? "🌏 You've gone around the world!" : "🌏 世界一周しました！") : en ? `🎉 You've arrived in ${nm(q)}` : `🎉 ${nm(q)}に着きました`;
    const next = en ? `Next: ${nm(nx)} (${fmtLeft(p.left, true)} to go)` : `次は ${nm(nx)}（あと ${fmtLeft(p.left)}）`;
    popup(`<img src="${q.img}" alt=""><b>${head}</b><p>${home ? (en ? `Lap ${p.lap + 1} starts. ` : `${p.lap + 1}周目へ。`) : ""}${next}</p>`, 7000);
  }

  async function openBook() {
    book = books.find((b) => b.id === bookId);
    if (book) store.set("textbooks-last", book.id);
    loadTrip();   // 町に着いたことを知らせるため
    $("reader").hidden = false;
    if (!book) { body.innerHTML = `<p class="msg err">「${esc(bookId)}」という教科書はありません。<a href="./">一覧へ</a></p>`; return; }
    $("bookIcon").textContent = book.icon || "📘";
    $("langs").hidden = book.langs.length < 2;
    try { chapters = await getJSON(base() + "chapters.json"); }
    catch (e) { body.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; return; }
    // コードの言葉の説明。英語で読むときは glossary_en を上にかぶせる（ない言葉は日本語のまま）
    if (book.glossary) getJSON(base() + book.glossary).then((g) => { glossaries.ja = g; pickGlossary(); }).catch(() => {});
    if (book.glossary_en) getJSON(base() + book.glossary_en).then((g) => { glossaries.en = g; pickGlossary(); }).catch(() => {});
    const termsReady = book.terms ? getJSON(base() + book.terms).then((x) => { terms = x; }).catch(() => {}) : Promise.resolve();
    // 前の場所（スマート農業News の cow.html）で読んでいた所と言葉を引き継ぐ
    if (book.legacy && !store.get(POS_KEY()) && book.legacy.pos && store.get(book.legacy.pos)) store.set(POS_KEY(), store.get(book.legacy.pos));
    if (book.legacy && !store.get("textbooks-lang-" + book.id) && book.legacy.lang && store.get(book.legacy.lang)) store.set("textbooks-lang-" + book.id, store.get(book.legacy.lang));
    let saved = null;
    try { saved = JSON.parse(store.get(POS_KEY(), "null")); } catch (e) { saved = null; }
    const h = fromHash();
    const lang = (h && h.lang) || store.get("textbooks-lang-" + book.id) || (saved && saved.lang) || book.langs[0];
    await termsReady;
    if (h) await show(h.idx, lang, saved && saved.idx === h.idx && saved.lang === lang ? saved : null);
    else if (saved) await show(saved.idx, lang, saved.lang === lang ? saved : { h: saved.h, r: saved.r });
    else await show(0, lang, null);
  }

  getJSON("books.json").then((b) => { books = b; return bookId ? openBook() : showShelf(); })
    .catch((e) => { document.body.insertAdjacentHTML("afterbegin", `<p class="msg err">読み込めませんでした（${esc(e.message)}）</p>`); });
})();
</script>
